version: '3.9'

# ============================================================
# Legacy CRM — Docker Compose
#
# Services:
#   - db         : MariaDB database
#   - backend    : Node.js Express API
#   - evolution  : Evolution API (WhatsApp / Baileys)
#   - frontend   : React app served via Nginx
#
# Usage:
#   cp .env.example .env && nano .env   # fill secrets
#   docker-compose up -d
# ============================================================

services:

  # ──────────────────────────────────────────────────────────
  # Database — MariaDB
  # ──────────────────────────────────────────────────────────
  db:
    image: mariadb:11.4
    container_name: legacy_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-legacy_root_2026}
      MARIADB_DATABASE: ${DB_NAME:-legacy}
      MARIADB_USER: ${DB_USER:-legacy_user}
      MARIADB_PASSWORD: ${DB_PASSWORD:-legacy_pass_2026}
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./backend/database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    ports:
      - "${DB_PORT:-3307}:3306"
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - legacy_network

  # ──────────────────────────────────────────────────────────
  # WhatsApp — Evolution API (Baileys, open source)
  # Infra barata: sem custos de terceiros
  # ──────────────────────────────────────────────────────────
  # ──────────────────────────────────────────────────────────
  # WhatsApp Bridge — Baileys based
  # ──────────────────────────────────────────────────────────
  whatsapp-bridge:
    build:
      context: ./whatsapp-bridge
      dockerfile: Dockerfile
    container_name: legacy_whatsapp_bridge
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-legacy-evolution-api-key-2026}
      WEBHOOK_URL: http://backend:3001/api/webhook/whatsapp
    volumes:
      - whatsapp_sessions:/app/sessions
    networks:
      - legacy_network

  redis:
    image: redis:7-alpine
    container_name: legacy_redis
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - legacy_network

  # ──────────────────────────────────────────────────────────
  # Backend — Node.js Express API
  # ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: legacy_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-legacy}
      DB_USER: ${DB_USER:-legacy_user}
      DB_PASSWORD: ${DB_PASSWORD:-legacy_pass_2026}
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      GOOGLE_AI_MODEL: ${GOOGLE_AI_MODEL:-gemini-2.5-flash}
      GOOGLE_AI_MEDIA_MODEL: ${GOOGLE_AI_MEDIA_MODEL:-gemini-2.5-flash}
      WHATSAPP_API_URL: http://whatsapp-bridge:8081
      WHATSAPP_API_KEY: ${EVOLUTION_API_KEY:-legacy-evolution-api-key-2026}
      WHATSAPP_INSTANCE: ${WHATSAPP_INSTANCE:-legacy-crm}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-legacy-webhook-secret-2026}
    ports:
      - "3001:3001"
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:3001/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - legacy_network

  # ──────────────────────────────────────────────────────────
  # Frontend — React + Nginx
  # ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./legacy-bot-login
      dockerfile: Dockerfile
      target: production
    container_name: legacy_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./legacy-bot-login/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - legacy_network

# ──────────────────────────────────────────────────────────
# Volumes
# ──────────────────────────────────────────────────────────
volumes:
  db_data:
    name: legacy_db_data
  whatsapp_sessions:
    name: legacy_whatsapp_sessions
  uploads_data:
    name: legacy_uploads_data

# ──────────────────────────────────────────────────────────
# Networks
# ──────────────────────────────────────────────────────────
networks:
  legacy_network:
    name: legacy_network
    driver: bridge
